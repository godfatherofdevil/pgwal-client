repos:
-   repo: local
    hooks:
    -   id: update-project-structure
        name: update project structure docs
        entry: python scripts/update_project_structure.py
        language: system
        pass_filenames: false
    -   id: sync-pgwal-stubs
        name: check pgwal stubs
        entry: python scripts/sync_stubs.py --check
        language: system
        pass_filenames: false
-   repo: https://github.com/psf/black
    rev: 22.3.0
    hooks:
    - id: black
      args: ['-S']
      name: black (python)
      exclude: '\.pyi$'
-   repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      -   id: flake8
-   repo: https://github.com/pycqa/pylint
    rev: v3.2.7
    hooks:
      -   id: pylint
          name: pylint (python)
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      -   id: mypy
          additional_dependencies:
            - pydantic>=2.12.0,<2.13.0
            - psycopg2-binary==2.9.11
            - types-psycopg2>=2.9.21,<3
          pass_filenames: false
          args: ["-p", "pgwal"]
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-json
    -   id: check-yaml
    -   id: check-added-large-files
        args: ['--maxkb=512']
    - id: no-commit-to-branch # Prevents commits directly to master/main
      name: don't commit to default branch
- repo: https://github.com/sqlfluff/sqlfluff
  rev: 3.0.5
  hooks:
      - id: sqlfluff-lint
        args: ['--dialect=postgres']
      - id: sqlfluff-fix
        args: ['--dialect=postgres']
