name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: read  # to check out code

env:
  TEST_DB_IMAGE: ghcr.io/godfatherofdevil/postgres-18-alpine-wal2json:latest
  TEST_DB_NAME: tests
  TEST_DB_USER: tests
  TEST_DB_PASSWORD: secret
  TEST_DB_PORT: "5432"
  TEST_DB_CONTAINER: pgwal-tests
  TEST_DB_SUPERUSER: tests
  TEST_RABBITMQ_IMAGE: rabbitmq:4.3-alpine
  TEST_RABBITMQ_PORT: "5672"
  TEST_RABBITMQ_CONTAINER: pgwal-rabbit-tests
  TEST_RABBITMQ_HOST: localhost
  TEST_RABBITMQ_USER: tests
  TEST_RABBITMQ_PASSWORD: secret
  TEST_RABBITMQ_VHOST: /
  TEST_KAFKA_IMAGE: apache/kafka-native:3.9.1
  TEST_KAFKA_PORT: "9092"
  TEST_KAFKA_CONTAINER: pgwal-kafka-tests
  TEST_KAFKA_HOST: localhost

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit -r requirements_dev.txt
      - name: Verify generated structure docs
        run: |
          python scripts/update_project_structure.py
          git diff --exit-code -- docs/project-structure.md
      - name: Run Precommit on all files
        run: |
          SKIP=no-commit-to-branch pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python_version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Python ${{ matrix.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
      - name: Start PostgreSQL
        run: |
          docker run --rm -d \
            --name "$TEST_DB_CONTAINER" \
            -p "$TEST_DB_PORT:5432" \
            -e POSTGRES_DB="$TEST_DB_NAME" \
            -e POSTGRES_USER="$TEST_DB_USER" \
            -e POSTGRES_PASSWORD="$TEST_DB_PASSWORD" \
            --health-cmd "pg_isready -h 127.0.0.1 -U $TEST_DB_USER -d $TEST_DB_NAME" \
            --health-interval 2s \
            --health-timeout 5s \
            --health-retries 30 \
            "$TEST_DB_IMAGE"
      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$TEST_DB_CONTAINER")
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$TEST_DB_CONTAINER"
          exit 1
      - name: Bootstrap PostgreSQL role
        run: |
          docker exec "$TEST_DB_CONTAINER" psql \
            -h 127.0.0.1 \
            -U "$TEST_DB_SUPERUSER" \
            -d "$TEST_DB_NAME" \
            -c "ALTER ROLE $TEST_DB_USER WITH REPLICATION;"
      - name: Start RabbitMQ
        run: |
          docker run --rm -d \
            --name "$TEST_RABBITMQ_CONTAINER" \
            -p "$TEST_RABBITMQ_PORT:5672" \
            -e RABBITMQ_DEFAULT_USER="$TEST_RABBITMQ_USER" \
            -e RABBITMQ_DEFAULT_PASS="$TEST_RABBITMQ_PASSWORD" \
            --health-cmd "rabbitmq-diagnostics -q ping" \
            --health-interval 2s \
            --health-timeout 5s \
            --health-retries 30 \
            "$TEST_RABBITMQ_IMAGE"
      - name: Wait for RabbitMQ
        run: |
          for _ in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$TEST_RABBITMQ_CONTAINER" 2>/dev/null)
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$TEST_RABBITMQ_CONTAINER"
          exit 1
      - name: Start Kafka
        run: |
          docker run --rm -d \
            --name "$TEST_KAFKA_CONTAINER" \
            -p "$TEST_KAFKA_PORT:9092" \
            --health-cmd '/bin/bash -lc "exec 3<>/dev/tcp/127.0.0.1/9092"' \
            --health-interval 2s \
            --health-timeout 5s \
            --health-retries 30 \
            "$TEST_KAFKA_IMAGE"
      - name: Wait for Kafka
        run: |
          for _ in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$TEST_KAFKA_CONTAINER" 2>/dev/null)
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$TEST_KAFKA_CONTAINER"
          exit 1
      - name: Install Dependencies
        run: |
          python -m pip install -r requirements_dev.txt -r requirements_test.txt
          python -m pip install -e .
      - name: Run Tests
        run: |
          python -m pytest
      - name: PostgreSQL logs
        if: always()
        run: docker logs "$TEST_DB_CONTAINER"
      - name: RabbitMQ logs
        if: always()
        run: docker logs "$TEST_RABBITMQ_CONTAINER"
      - name: Kafka logs
        if: always()
        run: docker logs "$TEST_KAFKA_CONTAINER"
      - name: Stop PostgreSQL
        if: always()
        run: docker stop "$TEST_DB_CONTAINER"
      - name: Stop RabbitMQ
        if: always()
        run: docker stop "$TEST_RABBITMQ_CONTAINER"
      - name: Stop Kafka
        if: always()
        run: docker stop "$TEST_KAFKA_CONTAINER"
